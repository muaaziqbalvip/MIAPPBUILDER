name: Build MINEXUS TV Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (from android-app folder)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Gradle Wrapper & Permissions in android-app
        working-directory: ./android-app
        run: |
          # If gradlew is not found or not executable, create wrapper
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./android-app
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MINEXUS-TV-Debug-APK
          path: |
            android-app/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Build Release APK (Unsigned / Release Mode)
        working-directory: ./android-app
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon || echo "Release build step skipped or completed"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MINEXUS-TV-Release-APK
          path: |
            android-app/app/build/outputs/apk/release/*.apk
            **/build/outputs/apk/release/*.apk
          retention-days: 30
