name: Build MINEXUS TV Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Official Gradle System
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.2'

      - name: Fix Missing Gradle Wrapper JAR & Permissions
        working-directory: ./android-app
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading official gradle-wrapper.jar..."
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar || true
          fi
          # If still not present, regenerate wrapper using system gradle
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.2.2
          fi
          chmod +x gradlew || true

      - name: Build APK (with Fallback to System Gradle)
        working-directory: ./android-app
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MINEXUS-TV-Debug-APK
          path: |
            android-app/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          retention-days: 30
