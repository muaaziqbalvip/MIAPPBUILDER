name: Build MINEXUS TV Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          elif [ -f "./android-app/gradlew" ]; then
            chmod +x ./android-app/gradlew
          fi

      - name: Build APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ -f "./android-app/gradlew" ]; then
            cd android-app && ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle wrapper not found, generating wrapper..."
            gradle wrapper
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Find and Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MINEXUS-TV-Official-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create Release (Optional for Tagged Pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
