name: Build MINEXUS TV Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Resources, AndroidX & Gradle Wrapper
        working-directory: ./android-app
        run: |
          mkdir -p gradle/wrapper
          curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.1/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew || true
          
          # Ensure AndroidX Properties
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties

          # Ensure App Icon Drawable Exists
          mkdir -p app/src/main/res/drawable
          if [ ! -f "app/src/main/res/drawable/ic_app_logo.xml" ]; then
            cat << 'EOF' > app/src/main/res/drawable/ic_app_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#E50914" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFFFF" android:pathData="M30,30 L45,30 L54,52 L63,30 L78,30 L78,78 L65,78 L65,48 L58,65 L50,65 L43,48 L43,78 L30,78 Z" />
          </vector>
          EOF
          fi

      - name: Build Debug APK
        working-directory: ./android-app
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MINEXUS-TV-Debug-APK
          path: |
            android-app/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          retention-days: 30
